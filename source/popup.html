<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container" id="loading-state">
    <div class="spinner"></div>
    <div class="message">加载中...</div>
  </div>
  <div class="container hidden" id="login-state">
    <div class="icon-wrap">
      <img src="icon180.png" alt="Juejin" class="logo">
      <div class="title-wrap">
        <div class="app-name">Juejin Notifier</div>
        <div class="app-desc">掘金消息通知小助手</div>
      </div>
    </div>
    <div class="message">您尚未登录掘金，或本地无登录信息。</div>
    <button id="login-btn" class="primary-btn">前往登录</button>
  </div>
  <div class="container hidden" id="status-state">
    <div class="topbar">
      <div class="icon-wrap">
        <img src="icon180.png" alt="Juejin" class="logo">
        <div class="title-wrap">
          <div class="app-name">Juejin Notifier</div>
          <div class="app-desc">掘金消息通知小助手</div>
        </div>
      </div>
      <button id="settings-btn" class="icon-btn" title="设置">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
    <div class="user-card" id="user-card">
      <img id="user-avatar" class="user-avatar" src="" alt="avatar">
      <div class="user-info">
        <div class="user-name-row">
          <span id="user-name" class="user-name"></span>
          <span id="user-level" class="user-level"></span>
        </div>
        <div id="user-desc" class="user-desc"></div>
      </div>
    </div>
    <div class="message-list">
      <div class="msg-item" data-type="1">
        <span>赞和收藏</span>
        <div class="msg-actions">
          <span class="ignored-label hidden">（已忽略）</span>
          <span id="msg-1" class="highlight">0</span>
          <button class="toggle-ignore-btn">忽略</button>
        </div>
      </div>
      <div class="msg-item" data-type="3">
        <span>评论</span>
        <div class="msg-actions">
          <span class="ignored-label hidden">（已忽略）</span>
          <span id="msg-3" class="highlight">0</span>
          <button class="toggle-ignore-btn">忽略</button>
        </div>
      </div>
      <div class="msg-item" data-type="2">
        <span>新增粉丝</span>
        <div class="msg-actions">
          <span class="ignored-label hidden">（已忽略）</span>
          <span id="msg-2" class="highlight">0</span>
          <button class="toggle-ignore-btn">忽略</button>
        </div>
      </div>
      <div class="msg-item" data-type="7">
        <span>私信</span>
        <div class="msg-actions">
          <span class="ignored-label hidden">（已忽略）</span>
          <span id="msg-7" class="highlight">0</span>
          <button class="toggle-ignore-btn">忽略</button>
        </div>
      </div>
      <div class="msg-item" data-type="4">
        <span>系统通知</span>
        <div class="msg-actions">
          <span class="ignored-label hidden">（已忽略）</span>
          <span id="msg-4" class="highlight">0</span>
          <button class="toggle-ignore-btn">忽略</button>
        </div>
      </div>
    </div>
    <div class="action-wrap">
      <button id="view-msg-btn" class="primary-btn">查看消息</button>
      <button id="refresh-btn" class="secondary-btn">刷新</button>
    </div>
  </div>

  <!-- Settings Panel Overlay -->
  <div id="settings-panel" class="settings-panel hidden">
    <div class="settings-header">
      <button id="settings-back-btn" class="icon-btn" title="返回">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <span class="settings-title">设置</span>
    </div>
    <div class="settings-body">
      <div class="settings-section">
        <div class="settings-label">外观主题</div>
        <select id="theme-select" class="settings-select">
          <option value="system">跟随系统</option>
          <option value="light">浅色主题</option>
          <option value="dark">深色主题</option>
        </select>
      </div>
      <div class="settings-section">
        <div class="settings-label">刷新间隔</div>
        <select id="refresh-interval" class="settings-select">
          <option value="1">1 分钟</option>
          <option value="3">3 分钟</option>
          <option value="5">5 分钟</option>
          <option value="30">半小时</option>
          <option value="60">一小时</option>
        </select>
      </div>
      <div class="settings-divider"></div>
      <div class="settings-about">
        <div class="settings-about-item">
          <span>🔧 代码已开源</span>
          <a href="#" id="settings-github-link" class="settings-about-tag">GitHub</a>
        </div>
        <div class="settings-about-item">
          <span>☕ 感谢 <a href="#" id="settings-sponsor-link" class="settings-about-link">fthux.com</a> 的赞助支持</span>
        </div>
      </div>
      <div class="settings-divider"></div>
      <button id="rate-btn" class="settings-about-item settings-about-btn">
        <span>⭐ 给个好评吧！</span>
        <svg class="settings-about-tag" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button id="feedback-btn" class="settings-about-item settings-about-btn">
        <span>💡 想法与反馈</span>
        <svg class="settings-about-tag" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <div class="settings-divider"></div>
      <button id="logout-btn" class="settings-logout-btn">退出账号</button>
      <div class="settings-version" id="settings-version"></div>
    </div>
  </div>

  <div id="confirm-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-title" style="font-weight: 600; margin-bottom: 12px;">提示</div>
      <div class="modal-desc">确定要退出当前账号吗？</div>
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="secondary-btn">取消</button>
        <button id="modal-confirm-btn" class="danger-btn">确定退出</button>
      </div>
    </div>
  </div>
  <div class="global-footer">
    <div>本扩展已开源 · <a href="#" id="github-link" class="sponsor-link">查看 GitHub 源码</a></div>
    <div>☕ 感谢 <a href="#" id="footer-sponsor-link" class="sponsor-link">fthux.com</a> 的赞助支持</div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
